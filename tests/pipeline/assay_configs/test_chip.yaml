assay: ChIP
project:
  name: test
  description: "Test project for ChIP-seq"

assay_config:
  peak_calling:
    method:
      - lanceotron
      - homer
      - macs2
      - macs3
  bigwigs:
    pileup_method:
      - deeptools
      - bamnado
      - homer
    binsize: 100
    scale_methods:
      - unscaled
      - csaw
    # The pipeline test fixture fabricates a second (subsampled) MLL2 "replicate"
    # from the real MLL reads so the "default" scaling group has 2 members,
    # letting all bamnado scaling methods run for real (see conftest.py::design).
    scaling_methods:
      - csaw_background
      - tmm
      - median_of_ratios
      - cpm
    perform_comparisons: True
  create_dataset: True 
